<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spots</title>
    <meta name="author" content="Sarah Alice" />
    <meta name="description" content="TripleTen Spots App" />
    <meta name="keywords" content="Spots TripleTen App" />
    <link rel="icon" type="img/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="./images/logo.svg" alt="Spots Logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile">
          <div class="profile__avatar-section">
            <img
              src="./images/avatar.jpg"
              alt="Profile Avatar"
              class="profile__avatar"
            />
            <div class="profile__column">
              <div>
                <h1 class="profile__name">Bessie Coleman</h1>
                <p class="profile__description">Civil Aviator</p>
              </div>
              <button type="button" class="profile__edit-button">
                <img
                  src="./images/editprofileicon.svg"
                  alt=""
                  class="profile__edit-button-icon"
                />
                <span class="profile__button-text">Edit Profile</span>
              </button>
            </div>
          </div>
          <button type="button" class="profile__new-post-button">
            <img
              src="./images/plusicon.svg"
              alt=""
              class="profile__new-post-button-icon"
            />
            <span class="profile__button-text">New&nbsp;Post</span>
          </button>
        </section>
        <div class="cards">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button
                  type="button"
                  class="card__button card__button_delete"
                  aria-label="Delete Photo"
                ></button>
                <img class="card__image" src="data:," alt="Post's Image" />
                <div class="card__label">
                  <h2 class="card__title"></h2>
                  <button
                    type="button"
                    class="card__button card__button_like"
                    aria-label="Like Photo"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </div>
      </main>
      <footer class="footer">
        <p class="footer__text">2023 &copy; Spots</p>
      </footer>
    </div>
    <!--page-->
    <div class="modal" id="edit-profile-modal">
      <div class="modal__container">
        <button
          type="button"
          class="modal__close-button"
          aria-label="Close Edit Profile Form"
        ></button>
        <form class="modal__form">
          <h2 class="modal__title">Edit Profile</h2>
          <label for="userName" class="modal__form-label"
            >Name
            <input
              type="text"
              class="modal__form-input"
              placeholder="Type your name"
              id="userName"
              required
              minlength="2"
              maxlength="40"
            />
            <span class="modal__error-message"></span>
          </label>
          <label for="userDescription" class="modal__form-label"
            >Description
            <input
              type="text"
              class="modal__form-input"
              placeholder="Describe yourself"
              id="userDescription"
              required
              minlength="2"
              maxlength="200"
            />
            <span class="modal__error-message"></span>
          </label>
          <button type="submit" class="modal__submit-button" disabled>
            Save
          </button>
        </form>
      </div>
    </div>
    <div class="modal" id="new-post-modal">
      <div class="modal__container">
        <button
          type="button"
          class="modal__close-button"
          aria-label="Close New Post Form"
        ></button>
        <form class="modal__form">
          <h2 class="modal__title">New post</h2>
          <label for="imageLink" class="modal__form-label"
            >Image link
            <input
              type="url"
              class="modal__form-input"
              placeholder="Paste a link to the picture"
              id="imageLink"
              required
            />
            <span class="modal__error-message"></span>
          </label>
          <label for="caption" class="modal__form-label"
            >Caption
            <input
              type="text"
              class="modal__form-input"
              placeholder="Type your caption"
              id="caption"
              required
              minlength="2"
              maxlength="30"
            />
            <span class="modal__error-message"></span>
          </label>
          <button type="submit" class="modal__submit-button" disabled>
            Save
          </button>
        </form>
      </div>
    </div>
    <div class="modal" id="image-preview-modal">
      <div class="modal__preview-container">
        <button
          type="button"
          class="modal__preview-close-button"
          aria-label="Close Image Preview"
        ></button>
        <img class="modal__image" src="data:," alt="Preview Full-Sized Image" />
        <h2 class="modal__caption">Preview Image Title</h2>
      </div>
    </div>
    <script src="./scripts/index.js" type="module"></script>
  </body>
</html>
